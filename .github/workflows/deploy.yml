name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        continue-on-error: true

      - name: Debug node_modules
        run: |
          ls node_modules/.bin/astro 2>/dev/null && echo "astro found" || echo "astro MISSING"
          ls node_modules/astro/package.json 2>/dev/null && echo "astro pkg found" || echo "astro pkg MISSING"

      - name: Build Astro
        run: npm run build 2>&1 | tee build.log

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4