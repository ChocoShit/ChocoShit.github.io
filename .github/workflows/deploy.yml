name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Debug astro
        run: |
          ls node_modules/.bin/astro 2>/dev/null && echo "astro found" || echo "astro MISSING"
          ls node_modules/astro/package.json 2>/dev/null && echo "astro pkg found" || echo "astro pkg MISSING"
          cat node_modules/astro/package.json 2>/dev/null | python3 -c "import sys,json; print('astro version:', json.load(sys.stdin)['version'])"

      - name: Build site
        run: npm run build 2>&1 | tee build.log

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4